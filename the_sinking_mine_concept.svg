<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1100" viewBox="0 0 700 1100">
<defs>
 <linearGradient id="cave" x2="0" y2="1"><stop stop-color="#160d0c"/><stop offset="1" stop-color="#28110b"/></linearGradient>
 <linearGradient id="lava" x2="0" y2="1"><stop stop-color="#fff164"/><stop offset=".35" stop-color="#ff9b21"/><stop offset="1" stop-color="#e84312"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#71f7ff"/><stop offset="1" stop-color="#168cdb"/></linearGradient>
 <pattern id="stone" width="78" height="66" patternUnits="userSpaceOnUse"><rect width="78" height="66" fill="#38201a"/><path d="M4 10Q18 0 34 8l8 13-9 17-24-1L1 23zm43 12 16-7 14 8-4 22-19 7-10-14zM-3 49l21-4 12 10-5 15H1z" fill="#4a2c22" stroke="#211210" stroke-width="5"/><path d="M12 12l14-3M52 26l9-4M4 56l9-3" stroke="#634033" stroke-width="3" opacity=".7"/></pattern>
 <pattern id="dirt" width="34" height="30" patternUnits="userSpaceOnUse"><rect width="34" height="30" fill="#80563a"/><circle cx="6" cy="8" r="2" fill="#bd8150"/><circle cx="25" cy="20" r="2" fill="#54382d"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="700" height="1100" fill="url(#cave)"/>
