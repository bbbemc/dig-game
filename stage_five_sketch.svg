<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs>
 <linearGradient id="cave" x2="0" y2="1"><stop stop-color="#21140f"/><stop offset="1" stop-color="#100c0b"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#55dcff"/><stop offset=".35" stop-color="#168ee0"/><stop offset="1" stop-color="#07519d"/></linearGradient>
 <linearGradient id="lava" x2="0" y2="1"><stop stop-color="#ffe66a"/><stop offset=".32" stop-color="#ff9b22"/><stop offset="1" stop-color="#ed3811"/></linearGradient>
 <pattern id="dirt" width="48" height="42" patternUnits="userSpaceOnUse"><rect width="48" height="42" fill="#75432b"/><path d="M-5 9q14-12 27 0t30 0M4 32q12-9 25 0t29 0" fill="none" stroke="#955d39" stroke-width="7"/><circle cx="12" cy="20" r="2.5" fill="#bf8050"/><circle cx="39" cy="34" r="2.5" fill="#4f3326"/></pattern>
 <pattern id="rock" width="54" height="42" patternUnits="userSpaceOnUse"><rect width="54" height="42" fill="#37302c"/><path d="M2 4l20-2 8 8-6 14-20 2-5-10zm31 20 13-6 11 7-4 15-15 2-8-9z" fill="#514640" stroke="#29221f" stroke-width="3"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1400" height="900" fill="#17110e"/>
<path d="M0 0H1400V74H0Z" fill="#292522"/><circle cx="32" cy="37" r="10" fill="#e9544c"/><circle cx="63" cy="37" r="10" fill="#efbf38"/><circle cx="94" cy="37" r="10" fill="#77716b"/><text x="132" y="46" fill="#dfd2bd" font-family="Verdana" font-size="22" font-weight="bold">DIG GAME — STAGE 5: LEVEL CONCEPT</text>
