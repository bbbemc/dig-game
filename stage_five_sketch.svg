<g transform="translate(735 450)"><path d="M-18 16v-36l-12-13-24 7-8 42z" fill="#5a76a7" stroke="#c2d0f1" stroke-width="4"/><circle cx="-6" cy="-3" r="3" fill="#fff09a"/><circle cx="9" cy="-3" r="3" fill="#fff09a"/><path d="M-7 8h16" stroke="#242238" stroke-width="4"/><path d="M-47 0h-28" stroke="#594d40" stroke-width="6"/></g>
