<rect x="538" y="793" width="320" height="50" rx="4" fill="#211713" stroke="#80512f" stroke-width="3" opacity=".95"/><text x="698" y="824" fill="#efdfc7" font-family="Verdana" font-size="18" text-anchor="middle" font-weight="bold">SWIM • DIG • FIND THE EXIT</text>
