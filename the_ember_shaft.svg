<path d="M665 658q34-18 68 0t68 0t68 0t68 0v142H665z" fill="url(#lava)" stroke="#ffc34d" stroke-width="5" filter="url(#glow)"/>
<path d="M672 661q26-11 52 0t52 0t52 0t52 0t52 0t52 0" fill="none" stroke="#fff08b" stroke-width="6"/>
