<circle cx="195" cy="326" r="16" fill="#ffd1a0"/><path d="M177 325q2-23 18-23t18 23z" fill="#efb73a" stroke="#ffdc79" stroke-width="3"/><path d="M178 342h36l-3 36h-30z" fill="#3987b5" stroke="#f0c773" stroke-width="3"/><path d="M186 377l-7 18m25-18 7 18" stroke="#34241b" stroke-width="7" stroke-linecap="round"/><circle cx="190" cy="328" r="2" fill="#35231c"/><circle cx="202" cy="328" r="2" fill="#35231c"/>
<text x="195" y="419" fill="#e7d5bd" font-family="Verdana" font-size="13" text-anchor="middle">START</text>
<!-- bomb pickup on middle ledge -->
<circle cx="560" cy="477" r="14" fill="#242a2d" stroke="#e6bd67" stroke-width="3"/><path d="M568 465l9-8" stroke="#fbd66b" stroke-width="4"/><path d="M578 456l7-3" stroke="#ff6237" stroke-width="3"/><text x="560" y="458" fill="#f4d491" font-family="Verdana" font-size="12" text-anchor="middle">BOMB</text>
