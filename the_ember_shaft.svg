<path d="M1101 487l23-13 23 13v29l-23 14-23-14z" fill="#38434a" stroke="#bdcbcd" stroke-width="4"/><path d="M1112 493l24 18m0-18-24 18" stroke="#e2eeee" stroke-width="4"/>
<text x="1125" y="559" fill="#dde6e3" font-family="Verdana" font-size="13" text-anchor="middle" font-weight="bold">BOMB TO BREAK</text>
