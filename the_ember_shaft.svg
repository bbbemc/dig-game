<g transform="translate(1213 328)"><rect x="-19" y="-38" width="38" height="50" rx="6" fill="#536f9e" stroke="#c3d1f4" stroke-width="3"/><circle cx="-7" cy="-21" r="3" fill="#fff2ad"/><circle cx="8" cy="-21" r="3" fill="#fff2ad"/><path d="M18-5h34" stroke="#382e29" stroke-width="7"/></g>
<circle cx="1275" cy="323" r="7" fill="#ff6941" stroke="#ffd17a" stroke-width="3"/><path d="M1268 323h-31" stroke="#ff9b5b" stroke-width="3" stroke-dasharray="5 6"/>
<!-- small chest reward -->
<rect x="705" y="464" width="43" height="35" rx="5" fill="#b96f26" stroke="#f7d15a" stroke-width="4"/><path d="M705 478h43m-21-14v35" stroke="#f9de70" stroke-width="4"/>
<!-- exit -->
<rect x="1281" y="245" width="46" height="107" fill="#542b18" stroke="#c18a47" stroke-width="5"/><path d="M1290 257h28v83h-28z" fill="#211917"/><circle cx="1310" cy="302" r="4" fill="#ffd76e"/><text x="1304" y="231" fill="#f7db9b" font-family="Verdana" font-size="13" text-anchor="middle" font-weight="bold">EXIT</text>
