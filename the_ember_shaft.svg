<g transform="translate(729 328)"><path d="M-18 11v-35l12-12 25 7 9 40z" fill="#a84436" stroke="#ecab68" stroke-width="3"/><circle cx="-6" cy="-13" r="3" fill="#ffe27b"/><circle cx="10" cy="-13" r="3" fill="#ffe27b"/><path d="M-7 0h16" stroke="#381c18" stroke-width="3"/><path d="M-11 10l-5 14m28-14 5 14" stroke="#573126" stroke-width="6"/></g>
