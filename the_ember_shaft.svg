<path d="M780 190h230v114H780z" fill="#70462b" stroke="#3d281c" stroke-width="6"/><path d="M795 204h200v84H795z" fill="url(#water)" stroke="#66cfff" stroke-width="3"/><path d="M804 221q26-12 52 0t52 0t52 0t52 0" fill="none" stroke="#b5f4ff" stroke-width="5"/>
<path d="M900 290v65q0 24 24 24h35v78" fill="none" stroke="#168fe1" stroke-width="20"/><path d="M900 290v65q0 24 24 24h35v78" fill="none" stroke="#bbf5ff" stroke-width="4" stroke-dasharray="10 12"/>
<text x="895" y="326" fill="#b8f2ff" font-family="Verdana" font-size="13" text-anchor="middle" font-weight="bold">WATER TANK</text>
<!-- water cools lava into a basalt bridge -->
<path d="M784 578q28-15 56 0t56 0t56 0t56 0t56 0v58H784z" fill="url(#water)" opacity=".9"/>
<path d="M788 580q25-12 50 0t50 0t50 0t50 0t50 0" fill="none" stroke="#b7f5ff" stroke-width="5"/>
<path d="M790 643h282v22H790z" fill="#4a5052" stroke="#aab7b8" stroke-width="4"/>
<path d="M812 646l20 17m38-17 20 17m38-17 20 17m38-17 20 17m38-17 20 17" stroke="#687477" stroke-width="3"/>
<text x="930" y="697" fill="#d4e0df" font-family="Verdana" font-size="14" text-anchor="middle" font-weight="bold">COOLED ROCK BRIDGE</text>
