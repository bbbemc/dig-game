<rect x="44" y="99" width="274" height="55" fill="#201612" stroke="#895632" stroke-width="4"/><path d="M62 114l10 6 10-6v21l-10 10-10-10z" fill="#d9443e"/><rect x="94" y="116" width="205" height="22" fill="#741f1d" stroke="#bf8352" stroke-width="3"/><rect x="98" y="120" width="194" height="14" fill="#df423f"/><text x="195" y="136" text-anchor="middle" fill="#fff0dc" font-family="Verdana" font-size="14" font-weight="bold">100 / 100</text>
<rect x="44" y="163" width="178" height="49" fill="#201612" stroke="#895632" stroke-width="4"/><text x="68" y="197" fill="#f1c96e" font-family="Verdana" font-size="24">💣</text><text x="115" y="197" fill="#eadcc8" font-family="Verdana" font-size="20" font-weight="bold">× 1</text>
<rect x="1005" y="98" width="343" height="57" fill="#201612" stroke="#895632" stroke-width="4"/><text x="1177" y="134" text-anchor="middle" fill="#f0d6a7" font-family="Verdana" font-size="21" font-weight="bold">S2   THE EMBER SHAFT</text>
<rect x="488" y="192" width="422" height="95" fill="#211712" stroke="#8c5731" stroke-width="4"/><text x="699" y="222" text-anchor="middle" fill="#e2a637" font-family="Verdana" font-size="17" font-weight="bold">OBJECTIVE</text><text x="699" y="258" text-anchor="middle" fill="#f0dfc5" font-family="Verdana" font-size="20" font-weight="bold">Make a bridge and reach the exit.</text>
<rect x="500" y="817" width="400" height="58" fill="#211712" stroke="#80512f" stroke-width="4"/><rect x="520" y="830" width="42" height="34" fill="#3c281c" stroke="#a46d3e" stroke-width="3"/><text x="541" y="854" text-anchor="middle" fill="#f0dfc5" font-family="Verdana" font-size="20" font-weight="bold">A</text><rect x="574" y="830" width="42" height="34" fill="#3c281c" stroke="#a46d3e" stroke-width="3"/><text x="595" y="854" text-anchor="middle" fill="#f0dfc5" font-family="Verdana" font-size="20" font-weight="bold">D</text><text x="750" y="855" text-anchor="middle" fill="#f0dfc5" font-family="Verdana" font-size="19" font-weight="bold">MOVE</text>
</svg>
