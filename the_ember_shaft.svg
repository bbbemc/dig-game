<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#21120d"/><stop offset="1" stop-color="#100d0c"/></linearGradient>
 <linearGradient id="lava" x2="0" y2="1"><stop stop-color="#ffe76b"/><stop offset=".35" stop-color="#ff9b24"/><stop offset="1" stop-color="#e9360e"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#32bdff"/><stop offset="1" stop-color="#075ac6"/></linearGradient>
 <pattern id="soil" width="56" height="48" patternUnits="userSpaceOnUse"><rect width="56" height="48" fill="#75432b"/><path d="M-5 9q13-14 27-2t29 2M4 33q13-10 26 0t30 0" fill="none" stroke="#8f5835" stroke-width="8"/><circle cx="13" cy="20" r="3" fill="#b17648"/><circle cx="45" cy="39" r="3" fill="#4d3023"/></pattern>
 <pattern id="rock" width="62" height="48" patternUnits="userSpaceOnUse"><rect width="62" height="48" fill="#211a17"/><path d="M3 5l23-3 9 9-7 15-24 3-7-11zm34 20 17-7 13 9-4 19-20 4-10-12z" fill="#302522" stroke="#161211" stroke-width="4"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1400" height="900" fill="#15100e"/>
<path d="M0 0H1400V80H0Z" fill="#292522"/><circle cx="32" cy="40" r="10" fill="#e9544c"/><circle cx="64" cy="40" r="10" fill="#f0bf38"/><circle cx="96" cy="40" r="10" fill="#77716b"/>
<text x="140" y="50" fill="#dfd2bd" font-family="Verdana" font-size="22" font-weight="bold">DIG GAME — STAGE 2: THE EMBER SHAFT</text>
<rect x="20" y="80" width="1360" height="800" fill="url(#bg)"/>
<!-- cave border -->
<path d="M20 80H1380V177H20Z M20 177H65V800H20Z M1335 177h45v623h-45z M20 800H1380v80H20Z" fill="url(#soil)"/>
<!-- carved cavern, upper route -->
<path d="M65 177H1335V374H1140V540H930V374H665V520H470V374H65Z" fill="url(#rock)" opacity=".48"/>
<path d="M65 177H1335V374H1140V540H930V374H665V520H470V374H65Z" fill="#15100f"/>
<!-- ledges / dirt masses creating layered drops -->
<path d="M65 354h406v446H65zM470 500h195v300H470zM665 354h265v446H665zM930 520h210v280H930zM1140 354h195v446h-195z" fill="url(#soil)"/>
