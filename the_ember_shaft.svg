<path d="M262 329h108m-17-12 17 12-17 12" fill="none" stroke="#f4d27a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M515 388v76m-12-15 12 15 12-15" fill="none" stroke="#f4d27a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M663 485h91m-17-12 17 12-17 12" fill="none" stroke="#f4d27a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1155 454v-65m-12 15 12-15 12 15" fill="none" stroke="#f4d27a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
